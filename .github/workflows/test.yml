name: Verify and package Windows app
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest selftest -v
      - name: Test browser input, selection and download
        run: python -m unittest browser_selftest -v
        env:
          PLAYLIST_BROWSER_HEADLESS: '1'
      - run: python build.py
      - name: Test packaged executable
        shell: pwsh
        run: |
          $env:PLAYLIST_TEST_REPORT = "$pwd/packaged-test.txt"
          $process = Start-Process -FilePath ./dist/PlaylistBatchAssistant.exe -ArgumentList '--self-test' -PassThru -Wait -WindowStyle Hidden
          Get-Content $env:PLAYLIST_TEST_REPORT
          if ($process.ExitCode -ne 0) { exit 1 }
      - name: Test packaged browser flow
        shell: pwsh
        run: |
          $env:PLAYLIST_BROWSER_HEADLESS = '1'
          $env:PLAYLIST_BROWSER_REPORT = "$pwd/packaged-browser-test.txt"
          $process = Start-Process -FilePath ./dist/PlaylistBatchAssistant.exe -ArgumentList '--browser-self-test' -PassThru -Wait -WindowStyle Hidden
          Get-Content $env:PLAYLIST_BROWSER_REPORT
          if ($process.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: PlaylistBatchAssistant-Windows
          path: dist/PlaylistBatchAssistant.exe
